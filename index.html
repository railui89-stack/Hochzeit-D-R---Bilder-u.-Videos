<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsere Fotos &amp; Videos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f5f1;
    --ink: #16231f;
    --muted: #5d6d66;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
    --line: #d3dbd5;
    --card: #ffffff;
    --err: #b3261e;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 18px 64px; }
  h1 { font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1; margin: 0 0 10px; font-weight: 800; letter-spacing: -0.03em; }
  .lead { color: var(--muted); max-width: 46ch; margin: 0 0 26px; font-size: 1.05rem; }

  .upload {
    background: var(--card); border: 2px dashed var(--line); border-radius: 14px;
    padding: 22px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    transition: border-color .15s, background .15s;
  }
  .upload.drag { border-color: var(--accent); background: #e8f2ee; }
  .btn {
    appearance: none; border: 0; background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 700; padding: 13px 22px; border-radius: 10px; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible, .thumb:focus-visible, .lb button:focus-visible, .lb a:focus-visible {
    outline: 3px solid #f0b429; outline-offset: 2px;
  }
  .hint { color: var(--muted); font-size: .95rem; }

  #queue { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 6px; }
  #queue li { display: flex; justify-content: space-between; gap: 12px; font-size: .92rem; padding: 8px 12px; background: var(--card); border-radius: 8px; border: 1px solid var(--line); }
  #queue .ok { color: var(--accent); font-weight: 700; }
  #queue .fail { color: var(--err); font-weight: 700; }

  .bar { display: flex; justify-content: space-between; align-items: baseline; margin: 38px 0 14px; }
  .bar h2 { margin: 0; font-size: 1.5rem; letter-spacing: -0.01em; }
  .count { color: var(--muted); }

  #grid { columns: 8 80px; column-gap: 4px; }
  .thumb {
    display: block; width: 100%; margin: 0 0 4px; padding: 0; border: 0; cursor: zoom-in;
    background: var(--line); border-radius: 8px; overflow: hidden; break-inside: avoid;
  }
  .thumb img { display: block; width: 100%; height: auto; }
  .empty { color: var(--muted); padding: 30px 0; }
  .thumb.video { position: relative; min-height: 50px; aspect-ratio: 16 / 9; }
  .thumb.video img { height: 100%; object-fit: cover; }
  .thumb.video::after {
    content: "▶"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff;
    display: grid; place-items: center; font-size: 12px; padding-left: 2px;
  }
  .lb iframe { width: min(94vw, 1100px); height: 78vh; border: 0; border-radius: 4px; background: #000; display: none; }

  .lb { position: fixed; inset: 0; background: rgba(10,18,15,.94); display: none; align-items: center; justify-content: center; z-index: 10; }
  .lb.open { display: flex; }
  .lb img { max-width: 94vw; max-height: 84vh; border-radius: 4px; }
  .lb button, .lb a {
    position: absolute; background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 10px;
    font: inherit; font-weight: 700; padding: 10px 16px; cursor: pointer; text-decoration: none;
  }
  .lb .close { top: 14px; right: 14px; }
  .lb .dl { bottom: 14px; left: 50%; transform: translateX(-50%); }
  .lb .prev { left: 10px; top: 50%; }
  .lb .next { right: 10px; top: 50%; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <h1 id="title">Unsere Fotos</h1>
  <p class="lead" id="lead">Lade deine Fotos vom Event hoch und schau dir an, was die anderen aufgenommen haben.</p>

  <section class="upload" id="drop">
    <input type="file" id="file" accept="image/*,video/*" multiple hidden>
    <button class="btn" id="pick" type="button">Fotos & Videos auswählen</button>
    <span class="hint">Du kannst mehrere Dateien auf einmal hochladen. Gelöscht werden kann hier nichts.</span>
  </section>
  <ul id="queue" aria-live="polite"></ul>

  <div class="bar">
    <h2>Galerie</h2>
    <span class="count" id="count"></span>
  </div>
  <div id="grid"></div>
  <p class="empty" id="empty" hidden>Noch nichts da. Lade das erste Foto oder Video hoch!</p>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Foto ansehen">
  <button class="close" id="lbClose" type="button">Schließen</button>
  <button class="prev" id="lbPrev" type="button" aria-label="Voriges Foto">‹</button>
  <img id="lbImg" alt="">
  <iframe id="lbVid" allow="autoplay; fullscreen" allowfullscreen title="Video"></iframe>
  <button class="next" id="lbNext" type="button" aria-label="Nächstes Foto">›</button>
  <a class="dl" id="lbDl" target="_blank" rel="noopener">Original herunterladen</a>
</div>

<script>
// ====== EINSTELLUNGEN ======
const API_URL = "https://script.google.com/macros/s/AKfycbzNIKOvhiolh0n4upGXnaUXqtMG4owMMv5ejkzkcAc5R3cXWijcS_XJhCPZYTelUiYIwQ/exec"; // URL aus dem Apps-Script-Deployment
const TITLE   = "Unsere Fotos & Videos";                    // z. B. "Hochzeit Anna & Ben"
const LEAD    = "Lade deine Fotos und Videos vom Event hoch und schau dir an, was die anderen aufgenommen haben.";
const MAX_VIDEO_MB = 3000; // größere Videos werden abgelehnt
const MAX_IMAGE_MB = 200;  // größere Fotos werden abgelehnt
const IMAGE_VIA_SCRIPT_MB = 25; // Fotos bis zu dieser Größe laufen über das Script (sehr zuverlässig)
// ===========================

document.title = TITLE;
document.getElementById("title").textContent = TITLE;
document.getElementById("lead").textContent = LEAD;

const $ = id => document.getElementById(id);
const thumbUrl = (id, w) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
let photos = [];
let current = -1;

// ---------- Galerie ----------
async function loadGallery() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    if (data.files.length === photos.length && data.files.every((f, i) => f.id === photos[i].id)) return;
    photos = data.files;
    render();
  } catch (e) {
    console.error(e);
  }
}

function render() {
  const grid = $("grid");
  grid.textContent = "";
  photos.forEach((p, i) => {
    const b = document.createElement("button");
    b.className = "thumb" + (p.v ? " video" : ""); b.type = "button";
    b.setAttribute("aria-label", `${p.v ? "Video" : "Foto"} ${i + 1} öffnen`);
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = ""; img.src = thumbUrl(p.id, 300);
    b.appendChild(img);
    b.addEventListener("click", () => openLb(i));
    grid.appendChild(b);
  });
  $("empty").hidden = photos.length > 0;
  $("count").textContent = photos.length ? `${photos.length} Datei${photos.length === 1 ? "" : "en"}` : "";
}

// ---------- Lightbox ----------
function openLb(i) {
  current = (i + photos.length) % photos.length;
  const p = photos[current];
  if (p.v) {
    $("lbImg").style.display = "none"; $("lbImg").src = "";
    $("lbVid").style.display = "block";
    $("lbVid").src = `https://drive.google.com/file/d/${p.id}/preview`;
  } else {
    $("lbVid").style.display = "none"; $("lbVid").src = "";
    $("lbImg").style.display = "block";
    $("lbImg").src = thumbUrl(p.id, 1800);
  }
  $("lbDl").href = `https://drive.google.com/uc?export=download&id=${p.id}`;
  $("lb").classList.add("open");
  $("lbClose").focus();
}
function closeLb() { $("lb").classList.remove("open"); $("lbImg").src = ""; $("lbVid").src = ""; }
$("lbClose").onclick = closeLb;
$("lbPrev").onclick = () => openLb(current - 1);
$("lbNext").onclick = () => openLb(current + 1);
$("lb").addEventListener("click", e => { if (e.target === $("lb")) closeLb(); });
document.addEventListener("keydown", e => {
  if (!$("lb").classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") openLb(current - 1);
  if (e.key === "ArrowRight") openLb(current + 1);
});

// ---------- Upload ----------
// Foto im Original über das Apps Script (Base64) – ohne Verkleinerung
function toBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
async function uploadImageViaScript(file) {
  const data = await toBase64(file);
  // Kein Content-Type-Header setzen (text/plain), so gibt es keinen CORS-Preflight
  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ name: file.name, mimeType: file.type, data })
  });
  const out = await res.json();
  if (!out.ok) throw new Error(out.error);
}

// Foto/Video im Original: Upload-Adresse beim Script holen, Datei dann direkt zu Google Drive senden
async function uploadMedia(file, onProgress) {
  const isVideo = file.type.startsWith("video/");
  if (file.size > (isVideo ? MAX_VIDEO_MB : MAX_IMAGE_MB) * 1024 * 1024) throw new Error("Datei zu groß");
  const mime = file.type;
  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "start", mimeType: mime, size: file.size })
  });
  const out = await res.json();
  if (!out.ok) throw new Error(out.error);
  // Datei in 8-MB-Stücken über das Script an Drive weitergeben
  const CHUNK = 8 * 1024 * 1024; // muss ein Vielfaches von 256 KB sein
  for (let start = 0; start < file.size; start += CHUNK) {
    const end = Math.min(start + CHUNK, file.size);
    const data = await toBase64(file.slice(start, end));
    let ok = false, lastErr;
    for (let attempt = 0; attempt < 3 && !ok; attempt++) {
      try {
        const r = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "chunk", url: out.url, start, end, total: file.size, mimeType: mime, data })
        });
        const o = await r.json();
        if (!o.ok) throw new Error(o.error);
        ok = true;
      } catch (e) {
        lastErr = e;
        await new Promise(res => setTimeout(res, 1500 * (attempt + 1)));
      }
    }
    if (!ok) throw lastErr;
    onProgress(Math.round(end / file.size * 100));
  }
}

async function uploadFiles(files) {
  const list = [...files].filter(f => f.type.startsWith("image/") || f.type.startsWith("video/"));
  for (const file of list) {
    const li = document.createElement("li");
    const name = document.createElement("span"); name.textContent = file.name;
    const state = document.createElement("span"); state.textContent = "Wird hochgeladen …";
    li.append(name, state);
    $("queue").prepend(li);
    try {
      if (file.type.startsWith("image/") && file.size <= IMAGE_VIA_SCRIPT_MB * 1024 * 1024) {
        await uploadImageViaScript(file);
      } else {
        await uploadMedia(file, pct => { state.textContent = `Wird hochgeladen … ${pct} %`; });
      }
      state.textContent = "Fertig"; state.className = "ok";
    } catch (e) {
      state.textContent = "Fehlgeschlagen – bitte nochmal versuchen"; state.className = "fail";
      console.error(e);
    }
  }
  loadGallery();
}

$("pick").onclick = () => $("file").click();
$("file").onchange = e => { uploadFiles(e.target.files); e.target.value = ""; };
const drop = $("drop");
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("drag"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("drag"); }));
drop.addEventListener("drop", e => uploadFiles(e.dataTransfer.files));

loadGallery();
setInterval(loadGallery, 30000); // neue Fotos automatisch nachladen
</script>
</body>
</html>
